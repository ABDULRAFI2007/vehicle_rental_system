<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Edit vehicle details in the rental listing.">
    <title>Edit Vehicle — Vehicle Rental Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-brand">
            <span class="icon">🚗</span>
            <span>VehicleRental</span>
        </a>
        <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="#" onclick="adminLogout()" class="admin-link" style="background:rgba(255,107,107,0.15);color:var(--danger);border-color:rgba(255,107,107,0.3);">
                🚪 Logout
            </a>
        </div>
    </nav>

    <!-- ===== EDIT VEHICLE FORM ===== -->
    <div class="form-page">
        <div class="container">
            <div class="form-card" id="edit-form-card">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!requireAdmin()) throw new Error('Not authenticated');

        const urlParams = new URLSearchParams(window.location.search);
        const vehicleId = urlParams.get('id');

        async function loadVehicle() {
            const card = document.getElementById('edit-form-card');

            if (!vehicleId) {
                card.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        <h3>No vehicle selected</h3>
                        <p><a href="admin-dashboard.html" style="color:var(--primary-light)">Go to Dashboard</a></p>
                    </div>`;
                return;
            }

            try {
                const v = await api.getVehicleById(vehicleId);

                card.innerHTML = `
                    <h2>✏️ Edit Vehicle</h2>
                    <p class="form-subtitle">Update the details for ${v.brand} ${v.model}</p>

                    <form id="edit-vehicle-form" onsubmit="handleEditVehicle(event)">

                        <div class="form-row">
                            <div class="form-group">
                                <label for="vehicleType">Vehicle Type *</label>
                                <select id="vehicleType" class="form-control" required>
                                    <option value="Bike" ${v.vehicleType === 'Bike' ? 'selected' : ''}>Bike</option>
                                    <option value="Car" ${v.vehicleType === 'Car' ? 'selected' : ''}>Car</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="brand">Brand *</label>
                                <input type="text" id="brand" class="form-control" value="${v.brand}" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="model">Model *</label>
                                <input type="text" id="model" class="form-control" value="${v.model}" required>
                            </div>
                            <div class="form-group">
                                <label for="vehicleNumber">Vehicle Number *</label>
                                <input type="text" id="vehicleNumber" class="form-control" value="${v.vehicleNumber}" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="pricePerDay">Price Per Day (₹) *</label>
                                <input type="number" id="pricePerDay" class="form-control" value="${v.pricePerDay}" min="1" required>
                            </div>
                            <div class="form-group">
                                <label for="ownerPhone">Owner Phone *</label>
                                <input type="tel" id="ownerPhone" class="form-control" value="${v.ownerPhone}" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="location">Rental Location *</label>
                            <input type="text" id="location" class="form-control" value="${v.location}" required>
                        </div>

                        <div class="form-group">
                            <label for="imageUrl">Image URL</label>
                            <input type="url" id="imageUrl" class="form-control" value="${v.imageUrl || ''}" 
                                   oninput="previewImage(this.value)">
                            <img id="image-preview" class="image-preview ${v.imageUrl ? 'show' : ''}" 
                                 src="${v.imageUrl || ''}" alt="Preview" onerror="this.classList.remove('show')">
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="available" ${v.available ? 'checked' : ''}> 
                                Mark as Available
                            </label>
                        </div>

                        <div id="form-error" class="form-error"></div>

                        <div class="form-actions">
                            <a href="admin-dashboard.html" class="btn btn-outline">Cancel</a>
                            <button type="submit" class="btn btn-primary" id="submit-btn">
                                💾 Save Changes
                            </button>
                        </div>
                    </form>`;

            } catch (err) {
                card.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        <h3>Vehicle not found</h3>
                        <p><a href="admin-dashboard.html" style="color:var(--primary-light)">Go to Dashboard</a></p>
                    </div>`;
            }
        }

        function previewImage(url) {
            const preview = document.getElementById('image-preview');
            if (url) {
                preview.src = url;
                preview.classList.add('show');
            } else {
                preview.classList.remove('show');
            }
        }

        async function handleEditVehicle(e) {
            e.preventDefault();
            const errorEl = document.getElementById('form-error');
            const btn = document.getElementById('submit-btn');
            errorEl.textContent = '';

            const vehicleData = {
                vehicleType: document.getElementById('vehicleType').value,
                brand: document.getElementById('brand').value.trim(),
                model: document.getElementById('model').value.trim(),
                vehicleNumber: document.getElementById('vehicleNumber').value.trim(),
                pricePerDay: parseFloat(document.getElementById('pricePerDay').value),
                ownerPhone: document.getElementById('ownerPhone').value.trim(),
                location: document.getElementById('location').value.trim(),
                imageUrl: document.getElementById('imageUrl').value.trim(),
                available: document.getElementById('available').checked
            };

            btn.disabled = true;
            btn.innerHTML = '⏳ Saving...';

            try {
                await api.updateVehicle(vehicleId, vehicleData);
                showToast('Vehicle updated successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 800);
            } catch (err) {
                errorEl.textContent = err.message || 'Failed to update vehicle';
                btn.disabled = false;
                btn.innerHTML = '💾 Save Changes';
            }
        }

        loadVehicle();
    </script>
</body>
</html>
