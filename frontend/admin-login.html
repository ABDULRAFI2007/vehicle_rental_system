<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for Vehicle Rental management dashboard.">
    <title>Admin Login — Vehicle Rental</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== LOGIN PAGE ===== -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="icon">🔐</span>
                <h2>Admin Login</h2>
                <p>Enter your credentials to manage vehicles</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" 
                           placeholder="Enter username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" 
                           placeholder="Enter password" required autocomplete="current-password">
                </div>

                <div id="login-error" class="form-error" style="margin-bottom:12px;"></div>

                <button type="submit" class="btn btn-primary" id="login-btn" 
                        style="width:100%;justify-content:center;">
                    🔓 Login
                </button>
            </form>

            <div style="text-align:center;margin-top:1.5rem;">
                <a href="index.html" style="color:var(--text-secondary);font-size:0.88rem;">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (isAdminLoggedIn()) {
            window.location.href = 'admin-dashboard.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            errorEl.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorEl.textContent = 'Please fill in all fields';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '⏳ Logging in...';

            try {
                const result = await api.adminLogin(username, password);
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminUsername', result.username);
                showToast('Login successful!', 'success');
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 500);
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed';
                btn.disabled = false;
                btn.innerHTML = '🔓 Login';
            }
        }
    </script>
</body>
</html>
